name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish package
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Verify tagged release contract
        run: >-
          python tools/release_gate.py
          --dist-dir dist
          --tag "${{ github.event.release.tag_name }}"

      - name: Install and smoke-test exact wheel
        run: >-
          python tools/installed_wheel_smoke.py
          --wheel-dir dist
          --expected-version "${{ github.event.release.tag_name }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
