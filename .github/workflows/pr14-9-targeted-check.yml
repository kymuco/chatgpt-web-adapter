name: PR14.9 targeted check

on:
  push:
    branches:
      - pr14-9-post-delegation-reconciliation

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pr14-9-post-delegation-reconciliation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - shell: bash
        run: |
          set +e
          python -m pip install -e ".[test]"
          install_status=$?
          python tools/engineering_quality_gate.py --base-ref 5cbe1613d05789bdaf131a93c234740099130970
          quality_status=$?
          python -m pytest -q             tests/test_post_delegation_reconciliation.py             tests/test_browser_native_provider.py             tests/test_browser_owned_write_runtime.py             tests/test_browser_owned_write_runtime_pr8_8.py             tests/test_canonical_conversation_read_v2_pr13_0.py             tests/test_ordinary_text_identity_pr14_1.py
          test_status=$?
          if [ "$install_status" -eq 0 ] && [ "$quality_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            result=PASS
          else
            result=FAIL
          fi
          printf 'result=%s\ninstall=%s\nquality=%s\ntests=%s\n'             "$result" "$install_status" "$quality_status" "$test_status"             > .pr14_9_targeted_check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr14_9_targeted_check
          git commit -m "Record PR14.9 targeted check [targeted]"
          git push origin HEAD:pr14-9-post-delegation-reconciliation
          exit 0
