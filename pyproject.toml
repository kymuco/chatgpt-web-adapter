[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-web-adapter"
version = "0.1.7"
description = "Python SDK for using an existing ChatGPT web session from Python and terminal tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "kymuco" }
]
keywords = ["chatgpt", "adapter", "sdk", "webchat"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kymuco/chatgpt-web-adapter"
Repository = "https://github.com/kymuco/chatgpt-web-adapter"
Issues = "https://github.com/kymuco/chatgpt-web-adapter/issues"
Changelog = "https://github.com/kymuco/chatgpt-web-adapter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
browser = ["zendriver==0.15.3"]

[project.scripts]
chatgpt-web-adapter = "chatgpt_web_adapter.cli_v02:main"
cwa = "chatgpt_web_adapter.cli_v02:main"
chatgpt-web-adapter-native-host = "chatgpt_web_adapter.browser_native_host:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatgpt_web_adapter = [
  "browser_native_extension/*.json",
  "browser_native_extension/*.js",
]
