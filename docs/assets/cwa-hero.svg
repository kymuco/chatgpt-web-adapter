<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240" role="img" aria-labelledby="title desc">
  <title id="title">chatgpt-web-adapter</title>
  <desc id="desc">CWA product identity: Python SDK, CLI and browser extension for an existing ChatGPT web session.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#171d2a"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1cc1ff"/>
      <stop offset="0.58" stop-color="#2a6dff"/>
      <stop offset="1" stop-color="#7e4cff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1038" height="238" rx="28" fill="url(#panel)" stroke="#2a3140" stroke-width="2"/>
  <circle cx="930" cy="20" r="220" fill="#557dff" opacity="0.07"/>

  <g transform="translate(54 50)">
    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#icon)"/>
    <rect x="4" y="4" width="132" height="132" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <g transform="translate(70 70) rotate(-35) translate(-70 -70)">
      <rect x="27" y="42" width="62" height="30" rx="15" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <rect x="51" y="68" width="62" height="30" rx="15" fill="none" stroke="#d9f6ff" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="230" y="94" fill="#f5f7fb" font-size="40" font-weight="700" letter-spacing="-1.2">chatgpt-web-adapter</text>
    <text x="231" y="132" fill="#a8b2c2" font-size="18" font-weight="500">Python SDK · CLI · Browser Extension</text>
    <text x="231" y="166" fill="#d2d8e2" font-size="16">Use an existing ChatGPT web session through a typed local runtime</text>
  </g>
</svg>
