<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT bridge probe</title>
  <style>
    body { font: 13px system-ui, sans-serif; margin: 12px; width: 420px; }
    select, textarea { width: 100%; box-sizing: border-box; }
    select { margin: 4px 0 8px; }
    textarea { min-height: 90px; }
    button { margin: 8px 8px 8px 0; }
    .note { font-size: 12px; opacity: 0.8; }
    pre { white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  </style>
</head>
<body>
  <strong>ChatGPT Web Adapter — PR8.0 probe</strong>
  <p>Uses an existing <code>chatgpt.com</code> tab. It does not read cookies or export Sentinel credentials.</p>
  <label for="tab">Target ChatGPT tab</label>
  <select id="tab">
    <option value="">Probe capabilities first</option>
  </select>
  <textarea id="text">Reply with exactly: SDK_BRIDGE_BACKGROUND_OK</textarea>
  <div>
    <button id="capabilities">Probe capabilities</button>
    <button id="send">Send through official page</button>
    <button id="stress">Run 20-turn background stress</button>
  </div>
  <p class="note">Stress requires the selected ChatGPT tab to stay in the background and uses fixed SDK_BRIDGE_STRESS_01..20 markers.</p>
  <pre id="output">Ready.</pre>
  <script src="popup.js"></script>
</body>
</html>
